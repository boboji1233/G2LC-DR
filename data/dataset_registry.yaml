    access_mode: PUBLIC
    application_status: NOT_DOWNLOADED
    license_access_class: verify-current-Figshare-terms
    redistribution_restrictions: Verify the current file-level licence before redistributing labels or derived metadata.
    source_family: MESSIDOR1
    patient_id_availability: UNKNOWN
    expected_local_layout: [Official MAPLES-DR label release and optional AdditionalData archive]
    last_checked_date: 2026-08-21
    next_owner_action: Recheck the current Figshare licence, then perform an explicit user-controlled download.
