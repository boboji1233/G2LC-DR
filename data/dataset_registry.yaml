schema_version: "1.0"
datasets:
  - dataset_id: messidor1
    official_name: MESSIDOR (original MESSIDOR-1)
    official_landing_page: https://www.adcis.net/en/third-party/messidor/
    official_publication: https://doi.org/10.5566/ias.1155
    access_mode: REQUEST
    application_status: NOT_REQUESTED
    license_access_class: research-request
    redistribution_restrictions: Do not redistribute images; follow current ADCIS terms.
    source_family: MESSIDOR1
    patient_id_availability: UNKNOWN
    expected_local_layout: [Original MESSIDOR-1 image volumes; never MESSIDOR-2]
    last_checked_date: 2026-08-21
    next_owner_action: Submit the official ADCIS research-use request and retain no private correspondence in Git.
  - dataset_id: maples_dr
    official_name: MAPLES-DR labels for MESSIDOR
    official_landing_page: https://figshare.com/articles/dataset/24328660
