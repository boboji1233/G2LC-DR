name: Import G2LC-DR repository

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message == 'Retry G2LC-DR repository import'
    runs-on: ubuntu-latest
    steps:
      - name: Check out existing repository
        uses: actions/checkout@v4

      - name: Restore verified project archive
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import tarfile
          from pathlib import Path

          encoded = """"""
          payload = base64.b64decode(encoded)
          expected = "5f0012075c0985db7eef16bdd1fce420a460d87027cbe7cfbe4265d87366e596"
          if hashlib.sha256(payload).hexdigest() != expected:
              raise RuntimeError("Project archive checksum mismatch")

          root = Path.cwd().resolve()
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:gz") as archive:
              for member in archive.getmembers():
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise RuntimeError(f"Unsafe archive path: {member.name}")
                  if member.issym() or member.islnk():
                      raise RuntimeError(f"Archive links are not allowed: {member.name}")
              archive.extractall(root)
          PY

          rm -f -- hello.py
      - name: Commit imported project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete G2LC-DR implementation"
          git push origin main
