name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --all-groups
      - run: uv run python scripts/stage1_5_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-5-audit-py${{ matrix.python-version }}
          path: artifacts/audit/stage1_5/
