name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --locked --all-groups --python ${{ matrix.python-version }}
      - name: Capture immutable Stage 1.6 baseline evidence
        run: |
          git worktree add ../g2lc-stage1-6-baseline ec3250d7e3dba0379c3b5205949c23e4f4ee5d59
          uv run --python ${{ matrix.python-version }} python scripts/stage1_6_capture_baseline.py ../g2lc-stage1-6-baseline
      - run: uv run --python ${{ matrix.python-version }} python scripts/stage1_6_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-6-audit-py${{ matrix.python-version }}
          path: |
            artifacts/audit/stage1_6/
            artifacts/review/G2LC_DR_STAGE1_6_1_REVIEW_*

  semantic-stress:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --all-groups --python 3.12
      - run: >-
          uv run --python 3.12 g2lc synthetic matrix
          --random-seeds 20 --semantic-generated-cases 2000 --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-6-semantic-stress
          path: artifacts/audit/stage1_6/
