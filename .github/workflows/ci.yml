name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest -q --cov=g2lc --cov-report=term-missing --cov-fail-under=85
      - run: uv run g2lc synthetic run --fixture minimal_dr
      - run: uv run g2lc certificate verify artifacts/synthetic/minimal_dr/certificate.json
