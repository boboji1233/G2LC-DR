[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "g2lc-dr"
version = "0.1.0"
description = "Certified guideline-to-label compilation for diabetic-retinopathy evidence designs"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "G2LC-DR contributors" }]
dependencies = [
  "hydra-core>=1.3.2,<2",
  "omegaconf>=2.3,<3",
  "ortools>=9.12,<10",
  "pandas>=2.2,<4",
  "pydantic>=2.11,<3",
  "pyarrow>=18,<24",
  "pyyaml>=6.0.2,<7",
  "rich>=14,<15",
  "typer>=0.16,<1",
  "z3-solver>=4.13,<5",
]

[project.scripts]
g2lc = "g2lc.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6.130,<7",
  "mypy>=1.15,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "types-pyyaml>=6.0.12.20241230,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/g2lc", "src/g2lc_verifier"]

[tool.hatch.build.targets.wheel.force-include]
"examples/synthetic" = "g2lc/fixtures/synthetic"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples/synthetic",
  "/knowledge",
  "/docs",
  "/scripts",
  "/configs/README.md",
  "/data/licenses.csv",
  "/.github/workflows",
  "/.gitignore",
  "/.pre-commit-config.yaml",
  "/pyproject.toml",
  "/uv.lock",
  "/uv.toml",
  "/Makefile",
  "/README.md",
  "/LICENSE",
  "/CITATION.cff",
  "/STATUS.md",
  "/CHANGELOG.md",
  "/IMPLEMENTATION_PLAN.md",
  "/THEORY_TO_TEST_MATRIX.md",
  "/AUDIT_REPORT_STAGE1_5.md",
  "/AUDIT_REPORT_STAGE1_6.md",
  "/OWNER_ACTIONS_AFTER_STAGE1_6.md",
]
exclude = [
  "/.venv*",
  "/.python",
  "/.uv-cache",
  "/.package-smoke",
  "/.review-verify",
  "/artifacts",
  "/runs",
  "/data/raw",
  "/data/interim",
  "/data/processed",
  "/dist",
  "/build",
  "**/__pycache__",
  "**/.pytest_cache",
  "**/.mypy_cache",
  "**/.ruff_cache",
  "**/.hypothesis",
  "**/*.pyc",
  "**/*.pyo",
  "**/*.log",
  "**/*.ckpt",
  "**/*.pt",
  "**/*.pth",
  "**/*.onnx",
  "**/*.safetensors",
  "**/*REVIEW*.zip",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["g2lc", "g2lc_verifier"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
strict = true
packages = ["g2lc"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ortools.*", "z3.*", "yaml.*"]
ignore_missing_imports = true
