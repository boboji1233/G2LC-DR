    expected_certificate_type: NOT_APPLICABLE
    provenance: SYNTHETIC
    focused_test: tests/stage1_5/test_semantic_matrix.py::test_infeasible_state_cannot_form_a_false_counterexample
  - id: deterministic_derivation_mapping
    expected_semantic_outcome: "a total unary mapping computes its target from its observed source"
