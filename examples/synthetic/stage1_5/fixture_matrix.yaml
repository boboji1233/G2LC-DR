schema_version: "1.0"
synthetic: true
provenance:
  source: "G2LC-DR Stage-1.5 semantic regression matrix"
  version: "1.0.0-synthetic"
  review_status: SYNTHETIC
  note: "No clinical rules, observed costs, patient data, or performance claims. Multi-input derivations are rejected, so two_operator_synergy is not applicable."
fixtures:
