    expected_exact_objective: NOT_APPLICABLE
    expected_certificate_type: NOT_APPLICABLE
    provenance: SYNTHETIC
    focused_test: tests/stage1_5/test_semantic_regressions.py::test_higher_unknown_rule_preserves_possible_action
  - id: same_action_different_clause
    expected_semantic_outcome: "different winning clause traces with the same normalized action are decision-equivalent"
    expected_exact_objective: NOT_APPLICABLE
    expected_certificate_type: NOT_APPLICABLE
    provenance: SYNTHETIC
    focused_test: tests/stage1_5/test_semantic_regressions.py::test_same_action_different_trace_has_same_decision_signature
  - id: default_same_action_as_rule
    expected_semantic_outcome: "a default and a rule producing the same normalized action are decision-equivalent"
    expected_exact_objective: NOT_APPLICABLE
    expected_certificate_type: NOT_APPLICABLE
    provenance: SYNTHETIC
    focused_test: tests/stage1_5/test_semantic_regressions.py::test_default_same_action_as_rule_has_same_decision_signature
  - id: typed_bool_int_collision
    expected_semantic_outcome: "boolean true and integer one remain distinct semantic values"
